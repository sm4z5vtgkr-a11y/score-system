<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛事控制台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f7f3f3;font-family:'Microsoft YaHei','PingFang SC',sans-serif;min-height:100vh;}
.top-bar{background:linear-gradient(135deg,#8b0020,#c0152a);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
.top-title{font-size:18px;font-weight:700;color:#fff;letter-spacing:2px;}
.top-sub{font-size:12px;color:rgba(255,220,220,0.7);margin-top:2px;}
.status-dot{width:10px;height:10px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;animation:pulse2 2s infinite;}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.4}}
.body{max-width:700px;margin:0 auto;padding:16px;}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 12px rgba(180,20,40,0.06);margin-bottom:14px;}
.card-title{font-size:14px;font-weight:700;color:#8b0020;letter-spacing:2px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #f0e0e0;}

/* 大屏模式切换 */
.mode-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
.mode-btn{padding:14px;font-size:14px;font-weight:700;border-radius:12px;border:none;cursor:pointer;font-family:inherit;transition:all .2s;letter-spacing:2px;text-align:center;}
.mode-btn.stage-btn{background:#f0e0e0;color:#8b0020;border:2px solid transparent;}
.mode-btn.score-btn{background:#f0e0e0;color:#8b0020;border:2px solid transparent;}
.mode-btn.active-stage{background:linear-gradient(135deg,#1a0050,#3a0080);color:#fff;border-color:#3a0080;box-shadow:0 4px 14px rgba(60,0,120,0.3);}
.mode-btn.active-score{background:linear-gradient(135deg,#8b0020,#c0152a);color:#fff;border-color:#c0152a;box-shadow:0 4px 14px rgba(180,20,40,0.3);}
.mode-btn:active{transform:scale(.97);}

/* 节目列表 */
.performer-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.perf-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1.5px solid #f0e0e0;background:#fdf8f8;cursor:pointer;transition:all .2s;}
.perf-item:active{transform:scale(.98);}
.perf-item.active{background:#fdf0f0;border-color:#c0152a;box-shadow:0 2px 8px rgba(180,20,40,0.1);}
.perf-num{width:24px;height:24px;border-radius:50%;background:#f0e0e0;color:#8b0020;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.perf-item.active .perf-num{background:#c0152a;color:#fff;}
.perf-info{flex:1;}
.perf-name{font-size:14px;font-weight:700;color:#333;}
.perf-song{font-size:12px;color:#888;margin-top:1px;}
.perf-group{font-size:11px;color:#bbb;}

.set-btn{padding:10px 20px;font-size:14px;border-radius:10px;border:none;cursor:pointer;font-family:inherit;background:#c0152a;color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(180,20,40,0.25);width:100%;}
.set-btn:active{transform:scale(.97);}

/* 评委状态 */
.judge-list{}
.judge-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f5eded;}
.judge-row:last-child{border-bottom:none;}
.j-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.j-dot.done{background:#4ade80;}
.j-dot.wait{background:#d0d0d0;animation:pulse2 1.5s infinite;}
.j-name{flex:1;font-size:13px;color:#444;}
.j-score{font-size:14px;font-weight:700;color:#c0152a;min-width:60px;text-align:right;}
.j-score.empty{color:#ccc;font-weight:400;}
.j-detail{font-size:10px;color:#aaa;text-align:right;margin-top:1px;}

.avg-row{display:flex;align-items:center;justify-content:space-between;background:#fdf0f0;border-radius:10px;padding:12px 16px;margin-top:12px;border:1px solid #f0d0d0;}
.avg-left{}
.avg-label-sm{font-size:12px;color:#888;letter-spacing:1px;}
.avg-count{font-size:11px;color:#bbb;margin-top:2px;}
.avg-rule{font-size:10px;color:#ccc;margin-top:2px;}
.avg-val{font-size:30px;font-weight:700;color:#c0152a;}

.btn-reveal{width:100%;margin-top:12px;padding:14px;font-size:16px;font-weight:700;background:linear-gradient(135deg,#8b0020,#c0152a);color:#fff;letter-spacing:4px;border-radius:10px;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(180,20,40,0.3);}
.btn-reveal:disabled{opacity:.35;cursor:default;}
.btn-reset{width:100%;margin-top:8px;padding:10px;font-size:13px;background:#fff0f0;color:#c0152a;border:1px solid #f0c0c0;border-radius:10px;cursor:pointer;font-family:inherit;}

/* 二维码 */
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;}
.qr-item{text-align:center;}
.qr-box{width:100%;aspect-ratio:1;background:#f5f0f0;border-radius:10px;border:1px solid #e8d0d0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;overflow:hidden;}
.qr-box:hover{border-color:#c0152a;}
.qr-label{font-size:11px;color:#888;margin-top:5px;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.current-badge{display:inline-flex;align-items:center;gap:6px;background:#fdf0f0;border:1px solid #f0d0d0;border-radius:8px;padding:6px 12px;margin-bottom:10px;font-size:13px;color:#c0152a;font-weight:700;}
</style>
</head>
<body>
<div class="top-bar">
  <div><div class="top-title">赛事控制台</div><div class="top-sub">全国第八届大学生艺术展演（声乐）</div></div>
  <div class="status-dot" id="statusDot"></div>
</div>

<div class="body">

  <!-- 大屏模式 -->
  <div class="card">
    <div class="card-title">大屏模式控制</div>
    <div class="mode-btns">
      <button class="mode-btn stage-btn" id="btnStage" onclick="setMode('stage')">🎭 舞台背景<br><span style="font-size:11px;font-weight:400;opacity:.8">选手表演时</span></button>
      <button class="mode-btn score-btn" id="btnScore" onclick="setMode('score')">📊 评分界面<br><span style="font-size:11px;font-weight:400;opacity:.8">选手下场后</span></button>
    </div>
  </div>

  <!-- 选手列表 -->
  <div class="card">
    <div class="card-title">选择上场选手</div>
    <div id="curBadge" class="current-badge" style="display:none">▶ 当前：<span id="curBadgeText"></span></div>
    <div class="performer-list" id="perfList"></div>
    <button class="set-btn" onclick="confirmPerformer()">确认上场 / 开始本轮评分</button>
  </div>

  <!-- 评委状态 -->
  <div class="card">
    <div class="card-title">评委打分状态</div>
    <div class="judge-list" id="judgeList"></div>
    <div class="avg-row">
      <div class="avg-left">
        <div class="avg-label-sm">当前平均分</div>
        <div class="avg-count" id="avgCount">0 / 7 位评委</div>
        <div class="avg-rule">去最高+最低后取平均</div>
      </div>
      <div class="avg-val" id="avgVal">—</div>
    </div>
    <button class="btn-reveal" id="revealBtn" onclick="triggerReveal()" disabled>✦ 揭晓最终得分</button>
    <button class="btn-reset" onclick="resetRound()">清除本轮评分</button>
  </div>

  <!-- 评委二维码 -->
  <div class="card">
    <div class="card-title">评委二维码（点击下载）</div>
    <div class="qr-grid" id="qrGrid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const SUPABASE_URL='https://ttibitjqnlvzlzhghbwg.supabase.co';
const SUPABASE_KEY='sb_publishable_ETIPKX3cLbH_LYLz9gTtxQ_QyPIiNKz';
const JUDGE_COUNT=7;

// 预录节目列表
const PERFORMERS=[
  {id:1,group:'乙组',name:'黄欣怡',song:'《美丽的阿瓦古力》'},
  {id:2,group:'甲组',name:'张敏怡、吕丹雅、张小涵、郑垚婷',song:'《日不落》'},
  {id:3,group:'乙组',name:'吉姝霏',song:'《知己红颜》'},
  {id:4,group:'甲组',name:'24/25级学前·音教·艺教',song:'《论语》'},
  {id:5,group:'乙组',name:'王思颖、李文淇、熊毅、吕永彬',song:'《大山》'},
  {id:6,group:'乙组',name:'张梓晴',song:'《怀念曲》'},
  {id:7,group:'乙组',name:'甘丽琳',song:'《故园恋》'},
  {id:8,group:'乙组',name:'吴冬润',song:'《河流》'},
  {id:9,group:'乙组',name:'赵萍仪',song:'《影帝》'},
  {id:10,group:'乙组',name:'冯小龙、刘裴',song:'《天地龙鳞》'},
];

let selectedPerformer=null, currentPerformer='', scores={}, currentMode='stage';

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

async function apiGet(path){try{const r=await fetch(SUPABASE_URL+path,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});return r.ok?r.json():[];}catch(e){return[];}}
async function apiPost(path,body){return fetch(SUPABASE_URL+path,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)});}
async function apiDelete(path){return fetch(SUPABASE_URL+path,{method:'DELETE',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});}

// 渲染节目列表
function buildPerfList(){
  const list=document.getElementById('perfList');
  list.innerHTML='';
  PERFORMERS.forEach(p=>{
    const item=document.createElement('div');
    item.className='perf-item'+(selectedPerformer&&selectedPerformer.id===p.id?' active':'');
    item.onclick=()=>selectPerformer(p);
    item.innerHTML=`<div class="perf-num">${p.id}</div><div class="perf-info"><div class="perf-name">${p.name}</div><div class="perf-song">${p.song}</div></div><div class="perf-group">${p.group}</div>`;
    list.appendChild(item);
  });
}

function selectPerformer(p){
  selectedPerformer=p;
  buildPerfList();
  const badge=document.getElementById('curBadge');
  badge.style.display='inline-flex';
  document.getElementById('curBadgeText').textContent=`${p.name} · ${p.song}`;
}

async function confirmPerformer(){
  if(!selectedPerformer){showToast('请先选择选手');return;}
  const name=selectedPerformer.name, item=selectedPerformer.song;
  await apiDelete('/rest/v1/current_performer?id=gt.0');
  await apiPost('/rest/v1/current_performer',{name,item});
  await apiDelete(`/rest/v1/scores?performer=eq.${encodeURIComponent(name)}`);
  await apiDelete('/rest/v1/reveal_flag?id=gt.0');
  currentPerformer=name; scores={};
  updateUI(); showToast(`✓ 已设置：${name}`);
}

async function setMode(mode){
  await apiDelete('/rest/v1/stage_mode?id=gt.0');
  await apiPost('/rest/v1/stage_mode',{mode});
  currentMode=mode; updateModeBtns();
  showToast(mode==='stage'?'已切换到舞台背景':'已切换到评分界面');
}

function updateModeBtns(){
  document.getElementById('btnStage').className='mode-btn stage-btn'+(currentMode==='stage'?' active-stage':'');
  document.getElementById('btnScore').className='mode-btn score-btn'+(currentMode==='score'?' active-score':'');
}

async function triggerReveal(){
  await apiDelete('/rest/v1/reveal_flag?id=gt.0');
  await apiPost('/rest/v1/reveal_flag',{show:true});
  showToast('✦ 已揭晓！');
}

async function resetRound(){
  if(!currentPerformer){showToast('未设置选手');return;}
  if(!confirm(`清除"${currentPerformer}"的所有评分？`))return;
  await apiDelete(`/rest/v1/scores?performer=eq.${encodeURIComponent(currentPerformer)}`);
  await apiDelete('/rest/v1/reveal_flag?id=gt.0');
  scores={}; updateUI(); showToast('已清除本轮评分');
}

// 去最高去最低取平均
function calcAvg(scoreMap){
  const vals=Object.values(scoreMap);
  if(vals.length<3)return vals.length>0?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2):null;
  const sorted=[...vals].sort((a,b)=>a-b);
  const trimmed=sorted.slice(1,sorted.length-1);
  return (trimmed.reduce((a,b)=>a+b,0)/trimmed.length).toFixed(2);
}

function updateUI(){
  const list=document.getElementById('judgeList');
  list.innerHTML='';
  let done=0;
  for(let i=1;i<=JUDGE_COUNT;i++){
    const s=scores[i]; if(s!==undefined)done++;
    const row=document.createElement('div'); row.className='judge-row';
    row.innerHTML=`<div class="j-dot ${s!==undefined?'done':'wait'}"></div>
      <div class="j-name">评委 ${i} 号</div>
      <div><div class="j-score ${s!==undefined?'':'empty'}">${s!==undefined?s.total+' 分':'未打分'}</div>
      ${s!==undefined?`<div class="j-detail">主${s.d1}·技${s.d2}·台${s.d3}·整${s.d4}</div>`:''}</div>`;
    list.appendChild(row);
  }
  document.getElementById('avgCount').textContent=`${done} / ${JUDGE_COUNT} 位评委`;
  const scoreNums={};
  Object.entries(scores).forEach(([k,v])=>scoreNums[k]=v.total);
  const avg=calcAvg(scoreNums);
  document.getElementById('avgVal').textContent=avg||'—';
  document.getElementById('revealBtn').disabled=(done<JUDGE_COUNT);
  updateModeBtns();
}

async function poll(){
  try{
    const p=await apiGet('/rest/v1/current_performer?select=*&limit=1');
    if(p.length>0)currentPerformer=p[0].name;
    if(currentPerformer){
      const s=await apiGet(`/rest/v1/scores?performer=eq.${encodeURIComponent(currentPerformer)}&select=judge_id,score,d1,d2,d3,d4&order=created_at.desc`);
      const ns={};
      s.forEach(r=>{if(!ns[r.judge_id])ns[r.judge_id]={total:r.score,d1:r.d1||0,d2:r.d2||0,d3:r.d3||0,d4:r.d4||0};});
      scores=ns;
    }
    const m=await apiGet('/rest/v1/stage_mode?select=*&limit=1');
    if(m.length>0)currentMode=m[0].mode;
    document.getElementById('statusDot').style.background='#4ade80';
    updateUI();
  }catch(e){document.getElementById('statusDot').style.background='#f87171';}
}

function buildQRCodes(){
  const base=location.href.replace('admin.html','judge.html');
  const grid=document.getElementById('qrGrid');
  grid.innerHTML='';
  for(let i=1;i<=JUDGE_COUNT;i++){
    const url=base+'?judge='+i;
    const item=document.createElement('div'); item.className='qr-item';
    const box=document.createElement('div'); box.className='qr-box'; box.id='qr-'+i;
    item.appendChild(box);
    const label=document.createElement('div'); label.className='qr-label'; label.textContent='评委 '+i+' 号';
    item.appendChild(label); grid.appendChild(item);
    try{
      new QRCode(box,{text:url,width:150,height:150,colorDark:'#8b0020',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
      box.onclick=()=>{const a=document.createElement('a');const c=box.querySelector('canvas');if(c){a.href=c.toDataURL();a.download=`评委${i}号.png`;a.click();}};
    }catch(e){box.textContent=url;box.style.fontSize='9px';box.style.wordBreak='break-all';box.style.padding='8px';}
  }
}

buildPerfList(); buildQRCodes(); poll();
setInterval(poll,2500);
</script>
</body>
</html>
